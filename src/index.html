<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Salgueiro Gestão</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><div id="boot-status" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:14px system-ui,Segoe UI,sans-serif;color:#666">Carregando o sistema…</div></div>
  <script>
    // Mostra qualquer erro de carregamento na tela (evita "tela branca" muda)
    (function () {
      function mostrar(txt) {
        var d = document.getElementById('erro-boot');
        if (!d) {
          d = document.createElement('div');
          d.id = 'erro-boot';
          d.style.cssText = 'position:fixed;inset:0;background:#7E1114;color:#fff;font:13px/1.5 ui-monospace,Consolas,monospace;padding:24px;overflow:auto;z-index:99999;white-space:pre-wrap';
          d.textContent = 'Ocorreu um erro ao abrir o sistema. Mostre isto ao suporte:\n\n';
          (document.body || document.documentElement).appendChild(d);
        }
        d.textContent += txt + '\n\n';
        try { if (window.Neutralino) Neutralino.debug.log(String(txt), 'ERROR'); } catch (e) {}
      }
      window.__erroBoot = mostrar;
      window.addEventListener('error', function (ev) {
        mostrar('ERRO: ' + (ev.message || '') + '\n@ ' + (ev.filename || '') + ':' + (ev.lineno || '') + ':' + (ev.colno || '') +
          (ev.error && ev.error.stack ? '\n' + ev.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason || {};
        mostrar('FALHA: ' + (r.message || r) + (r.stack ? '\n' + r.stack : ''));
      });
    })();
  </script>
  <!-- App desktop (Neutralino): client nativo + bibliotecas do backend local -->
  <script src="js/neutralino.js"></script>
  <script>
    // Inicializa a ponte nativa e garante que o X SEMPRE fecha o aplicativo:
    // se o backend estiver de pé, salva o banco antes; senão, fecha direto.
    if (window.Neutralino && !window.__TERMINAL_REDE) {
      try {
        Neutralino.init();
        // Ícone da barra de tarefas — ordem de prioridade:
        // 1ª) ícone personalizado escolhido pelo lojista em Configurações
        //     (%APPDATA%/SalgueiroGestao/dados/icone.ico — atualizações NUNCA tocam nesta pasta)
        // 2ª) icon.ico ao lado do executável (NL_PATH)
        // 3ª) extrai do bundle e grava no disco para as próximas vezes
        (async function() {
          try {
            var base = await Neutralino.os.getPath('data');
            var custom = base + '/SalgueiroGestao/dados/icone.ico';
            await Neutralino.filesystem.getStats(custom); // lança se não existir
            await Neutralino.window.setIcon(custom);
            return;
          } catch(_) { /* sem ícone personalizado — segue para o padrão */ }

          var dest = NL_PATH + '/icon.ico';
          try {
            await Neutralino.window.setIcon(dest);
          } catch(_) {
            try {
              var resp = await fetch('/img/icon.ico');
              var buf  = await resp.arrayBuffer();
              await Neutralino.filesystem.writeBinaryFile(dest, buf);
              await Neutralino.window.setIcon(dest);
            } catch(e) { console.warn('[icon]', e); }
          }
        })();
        Neutralino.events.on('windowClose', function () {
          // Timeout de segurança: força saída após 4 s mesmo que o save trave
          var _forcar = setTimeout(function () {
            try { Neutralino.app.exit(0); } catch (_) {}
          }, 4000);
          var salvar = window.__fecharComSalvamento;
          var p = salvar ? salvar() : Promise.resolve();
          p.then(function () { clearTimeout(_forcar); })
           .catch(function () { clearTimeout(_forcar); try { Neutralino.app.exit(0); } catch (_) {} });
        });
        // espelha erros do console no arquivo neutralinojs.log (diagnóstico)
        var _cerr = console.error.bind(console);
        console.error = function () {
          _cerr.apply(null, arguments);
          try {
            var m = Array.prototype.map.call(arguments, function (a) {
              return (a && a.stack) ? a.stack : (typeof a === 'object' ? JSON.stringify(a) : String(a));
            }).join(' ');
            Neutralino.debug.log(m.slice(0, 2000), 'ERROR');
          } catch (e) {}
        };
      } catch (e) { window.__erroBoot && window.__erroBoot('Falha ao iniciar a ponte nativa: ' + (e.message || e)); }
    }
  </script>
  <script src="js/vendor/sql-asm.js"></script>
  <script src="js/vendor/scrypt.js"></script>
  <script src="js/vendor/sha256.js"></script>
  <script src="js/vendor/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
